<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css" />
   

    <!-- Inporting google icons -->
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=location_onsearchwater_dropairwave" />
</head>

<body>
    <main class="main-container">
        <header class="input-container">
            <input class="city-input" type="text" placeholder="Search City" />
            <button class="search-btn">
                <span class="material-symbols-outlined"> search</span>
            </button>
        </header>

        <!--weather section -->
        <section class="weather-info" style="display: none;">
            <div class="location-date-container">
                <div class="location">
                    <span class="material-symbols-outlined">location_on</span>
                    <h4 class="country-txt">India</h4>
                </div>
                <h5 class="current-date-txt regular-txt">Fri, 05 Sep</h5>
            </div>

            <div class="weather-summary-container">
                <img src="assets/weather/clouds.svg" alt="cloudsimage" class="weather-summary-img" />
                <div class="weather-summary-info">
                    <h1 class="temp-txt">31 °C</h1>
                    <h1 class="condition-txt regular-txt">Clouds</h1>
                </div>
            </div>

            <div class="weather-conditions-container">
                <div class="condition-item">
                    <span class="material-symbols-outlined"> water_drop </span>
                    <div class="condition-info">
                        <h5 class="regular-txt">Humidity</h5>
                        <h5 class="humidity-value-txt">60%</h5>
                    </div>
                </div>
                <div class="condition-item">
                    <span class="material-symbols-outlined"> airwave </span>
                    <div class="condition-info">
                        <h5 class="regular-txt">Wind Speed</h5>
                        <h5 class="wind-value-txt">2&nbsp;m/s</h5>
                    </div>
                </div>
            </div>


            <div class="forecast-item-container">
                <div class="forecast-item">
                    <h5 class="forecast-item-date regular-txt">03, Sep</h5>
                    <img src="assets/weather/thunderstorm.svg" alt="" class="forecast-item-img">
                    <h5 class="forecast-item-temp">31 °C</h5>
                </div>
                <div class="forecast-item">
                    <h5 class="forecast-item-date regular-txt">03, Sep</h5>
                    <img src="assets/weather/thunderstorm.svg" alt="" class="forecast-item-img">
                    <h5 class="forecast-item-temp">31 °C</h5>
                </div>
                <div class="forecast-item">
                    <h5 class="forecast-item-date regular-txt">03, Sep</h5>
                    <img src="assets/weather/thunderstorm.svg" alt="" class="forecast-item-img">
                    <h5 class="forecast-item-temp">31 °C</h5>
                </div>
                <div class="forecast-item">
                    <h5 class="forecast-item-date regular-txt">03, Sep</h5>
                    <img src="assets/weather/thunderstorm.svg" alt="" class="forecast-item-img">
                    <h5 class="forecast-item-temp">31 °C</h5>
                </div>
                <div class="forecast-item">
                    <h5 class="forecast-item-date regular-txt">03, Sep</h5>
                    <img src="assets/weather/thunderstorm.svg" alt="" class="forecast-item-img">
                    <h5 class="forecast-item-temp">31 °C</h5>
                </div>
            </div>
        </section>

        <section class="search-city search-message">
            <div>
                <img src="assets/message/search-city.png" alt="imageofsearching" class="message-img">
            </div>
            <div>
                <h1>Search City</h1>
                <h4 class="regular-txt" style="margin-top: 10px;">Find out the weather conditions of the city.</h4>
            </div>
        </section>
        <section class="not-found search-message" style="display: none;">
            <div>
                <img src="assets/message/not-found.png" alt="imageofsearching" class="message-img">
            </div>
            <div>
                <h1>City Not Found</h1>
                <h4 class="regular-txt" style="margin-top: 10px;">Find out the weather conditions of the city.</h4>
            </div>
        </section>

    </main>
</body>

 <script src="script.js" defer ></script>

</html>
